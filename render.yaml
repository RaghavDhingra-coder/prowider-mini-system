services:
  - type: web
    name: connectora
    env: node
    region: oregon
    plan: free
    # Build the Next.js production app during Render's build phase.
    buildCommand: npm install --include=dev && npm run build
    # Start the already-built app with the custom Socket.IO server.
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
